<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xique-Xique Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>TV ao Vivo</h1>
  </header>

  <nav class="filtros">
    <button class="filtro ativo">Todos</button>
    <button class="filtro">Notícias</button>
    <button class="filtro">Esportes</button>
    <button class="filtro">Filmes</button>
    <button class="filtro">Infantil</button>
    <br>
  </nav>

  <main class="grade">
    <article class="cartao" tabindex="0">
      <div class="logo">N1</div>
      <h2 class="nome">Canal Notícias 1</h2>
      <p class="grupo">Notícias</p>
    </article>

    <article class="cartao" tabindex="0">
      <div class="logo">ES</div>
      <h2 class="nome">Esportes Play</h2>
      <p class="grupo">Esportes</p>
    </article>

    <article class="cartao" tabindex="0">
      <div class="logo">FM</div>
      <h2 class="nome">Filmes Max</h2>
      <p class="grupo">Filmes</p>
    </article>

    <article class="cartao" tabindex="0">
      <div class="logo">KD</div>
      <h2 class="nome">Kids Day</h2>
      <p class="grupo">Infantil</p>
    </article>
  </main>
</body>
</html>
